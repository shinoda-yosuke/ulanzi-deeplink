<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- The URL scheme separator "://" on a 24-unit grid; one rainbow runs from the lower left to the upper right -->
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="3" y1="21" x2="21" y2="3">
      <stop offset="0" stop-color="#FF453A"/>
      <stop offset="0.18" stop-color="#FF9F0A"/>
      <stop offset="0.34" stop-color="#FFD60A"/>
      <stop offset="0.5" stop-color="#30D158"/>
      <stop offset="0.66" stop-color="#64D2FF"/>
      <stop offset="0.82" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#BF5AF2"/>
    </linearGradient>
  </defs>
  <g transform="translate(128 128) scale(9.6) translate(-12.125 -12)">
    <circle cx="4.6" cy="9" r="1.75" fill="url(#rainbow)"/>
    <circle cx="4.6" cy="15.5" r="1.75" fill="url(#rainbow)"/>
    <path d="M9.3 20L14.1 4M15.3 20L20.1 4" fill="none" stroke="url(#rainbow)" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
